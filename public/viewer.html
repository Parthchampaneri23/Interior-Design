<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D GLB Model Viewer — RikModelExport22</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1211;
      color: #f5f5f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 24px;
      background: rgba(20, 24, 22, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    header h1 {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    header span.gold { color: #b79a70; }
    model-viewer {
      width: 100%;
      height: 100%;
      flex: 1;
      outline: none;
      --poster-color: transparent;
    }
    .hud {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 29, 26, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 20px;
      border-radius: 999px;
      display: flex;
      gap: 16px;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }
    .hud button {
      background: transparent;
      border: none;
      color: #f5f5f0;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .hud button:hover { color: #b79a70; }
    .telemetry {
      position: absolute;
      top: 70px;
      right: 24px;
      background: rgba(24, 29, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 18px;
      font-size: 11px;
      font-family: monospace;
      color: #999;
      line-height: 1.8;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
    }
    .telemetry strong { color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>3D GLB Inspector: <span class="gold">RikModelExport22.glb</span></h1>
    <div style="font-size: 12px; color: #888;">WebGL 2.0 • PBR Materials • Rigged Armature</div>
  </header>

  <model-viewer
    id="viewer"
    src="/RikModelExport22.glb"
    alt="RikModelExport22 3D Model"
    auto-rotate
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1.2"
    shadow-softness="0.8"
    exposure="1.2"
    environment-image="neutral"
    autoplay
  ></model-viewer>

  <div class="hud">
    <button id="btn-anim" onclick="togglePlay()">⏸️ Pause Animation</button>
    <span style="opacity: 0.3;">|</span>
    <button onclick="toggleRotate()">🔄 Auto-Rotate</button>
    <span style="opacity: 0.3;">|</span>
    <button onclick="resetCam()">🎯 Reset Camera</button>
  </div>

  <div class="telemetry">
    <div>FILE: <strong>RikModelExport22.glb</strong></div>
    <div>SIZE: <strong>13.84 MB</strong></div>
    <div>JOINTS: <strong style="color: #b79a70;">22 Bones</strong></div>
    <div>ANIMATION: <strong style="color: #b79a70;">Blink2 (Active)</strong></div>
    <div style="margin-top: 6px; font-size: 10px; color: #666;">Drag to rotate • Right-click to pan • Scroll to zoom</div>
  </div>

  <script>
    const v = document.getElementById('viewer');
    let isPlaying = true;
    let isRotate = true;

    function togglePlay() {
      if (isPlaying) {
        v.pause();
        document.getElementById('btn-anim').innerText = '▶️ Play Animation';
        isPlaying = false;
      } else {
        v.play();
        document.getElementById('btn-anim').innerText = '⏸️ Pause Animation';
        isPlaying = true;
      }
    }

    function toggleRotate() {
      isRotate = !isRotate;
      if (isRotate) {
        v.setAttribute('auto-rotate', '');
      } else {
        v.removeAttribute('auto-rotate');
      }
    }

    function resetCam() {
      v.cameraOrbit = '0deg 75deg 105%';
      v.jumpCameraToGoal();
    }
  </script>
</body>
</html>
